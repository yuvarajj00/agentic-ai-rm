<div
  class="flip-housing"
  [class.is-seconds]="isSeconds"
  [class.is-gradient-text]="isGradientText"
  [class.flip-anim-a]="flipTick() > 0 && flipTick() % 2 === 1"
  [class.flip-anim-b]="flipTick() > 0 && flipTick() % 2 === 0"
>
  <div class="half half-top-static">
    <div class="digit-face">{{ current() }}</div>
  </div>

  <div class="half half-bottom-static">
    <div class="digit-face">{{ previous() }}</div>
  </div>

  @if (flipTick() > 0) {
    <div class="half half-top-flip">
      <div class="digit-face">{{ previous() }}</div>
    </div>

    <div class="half half-bottom-flip">
      <div class="digit-face">{{ current() }}</div>
    </div>
  }

  <div class="center-split" aria-hidden="true"></div>

  @if (amPmBadge) {
    <div class="ampm-badge">{{ amPmBadge }}</div>
  }
</div>
